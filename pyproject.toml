[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paddle-api-cli"
dynamic = ["version"]
description = "A secure, spec-driven CLI for Paddle Billing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paddle CLI contributors" }]
keywords = ["paddle", "billing", "cli", "openapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.28,<1",
  "inquirerpy>=0.3.4,<1",
  "keyring>=25.7,<26",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
]

[project.scripts]
paddle = "paddle_cli.cli:main"

[project.urls]
Documentation = "https://omshejul.github.io/paddle-cli/"
Source = "https://github.com/omshejul/paddle-cli"
"Paddle API reference" = "https://developer.paddle.com/api-reference/"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paddle_cli"]

[tool.hatch.version]
path = "src/paddle_cli/__init__.py"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
